# DSSE TRACKING Drone Swarm Environment Config for EPyMARL
env: "dsse_tracking"

env_args:
  map_name: "dsse_tracking"
  n_agents: 4
  grid_size: 25
  timestep_limit: 750
  max_battery: 125
  depletion_rate: 1
  charge_rate: 15
  fault_prob: 0.0005
  mixing_alpha: 0.5
  compensation_bonus: 2.5
  compensation_penalty: -0.5
  compensation_horizon: 100
  seed: 1
